name: Gitee Sync

on:
  push:
    branches: [main]
  # Backfills or re-syncs one release; safe to repeat.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync, e.g. v0.2.0
        required: true
        type: string
  # release.yml calls this after creating the GitHub Release: a release created with GITHUB_TOKEN
  # raises no event that could trigger this workflow on its own.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      GITEE_TOKEN:
        required: true

permissions:
  contents: read

env:
  GITEE_REPO: dontcampy/pzl

jobs:
  mirror-main:
    name: Mirror main
    # A call from release.yml carries the caller's tag-push context, so the event alone is not enough.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The push is forced, so an older run finishing last would roll Gitee back.
    concurrency:
      group: gitee-mirror-main
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          # Gitee rejects pushes from a shallow clone.
          fetch-depth: 0

      - name: Push main
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: git push --force "https://dontcampy:$GITEE_TOKEN@gitee.com/$GITEE_REPO.git" "$GITHUB_SHA:refs/heads/main"

  release:
    name: Sync release ${{ inputs.tag }}
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push tag
        run: git push --force "https://dontcampy:$GITEE_TOKEN@gitee.com/$GITEE_REPO.git" "refs/tags/$TAG:refs/tags/$TAG"

      - name: Fetch GitHub release
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,body,isPrerelease > github-release.json
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist

      # Gitee takes each asset in one request, so speed has to come from the single connection: cubic
      # backs off hard on the lossy, high-latency path to China, BBR does not. Best effort only.
      - name: Tune TCP for uploads
        continue-on-error: true
        run: |
          sudo modprobe tcp_bbr
          sudo sysctl -w net.core.default_qdisc=fq net.ipv4.tcp_congestion_control=bbr
          sudo sysctl -w net.core.wmem_max=67108864 net.ipv4.tcp_wmem="4096 65536 67108864"

      - name: Create or update Gitee release
        timeout-minutes: 60
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/$GITEE_REPO"
          name=$(jq -r '.name' github-release.json)
          body=$(jq -r '.body' github-release.json)
          prerelease=$(jq -r '.isPrerelease' github-release.json)
          # Gitee requires a non-empty name and body.
          [[ -n "$name" ]] || name="$TAG"
          [[ -n "$body" ]] || body="$TAG"
          # --form-string: release notes starting with @ or < must not be read as a file.
          fields=(
            --form-string "access_token=$GITEE_TOKEN"
            --form-string "tag_name=$TAG"
            --form-string "name=$name"
            --form-string "body=$body"
            --form-string "prerelease=$prerelease"
          )

          # A tag without a release answers 200 with a null body.
          id=$(curl -sS --fail-with-body "$api/releases/tags/$TAG?access_token=$GITEE_TOKEN" | jq -r '.id // empty')
          if [[ -n "$id" ]]; then
            curl -sS --fail-with-body -o /dev/null -X PATCH "${fields[@]}" "$api/releases/$id"
          else
            id=$(curl -sS --fail-with-body "${fields[@]}" \
              --form-string "target_commitish=$(git rev-list -n 1 "$TAG")" \
              "$api/releases" | jq -r '.id')
          fi

          attached_names() {
            curl -sS --fail-with-body "$api/releases/$id/attach_files?access_token=$GITEE_TOKEN&per_page=100" | jq -r '.[].name'
          }

          # curl redraws its progress meter with \r every second; keep one line per 10 s for the log.
          throttle_progress() {
            local line last=-10
            while IFS= read -r -d $'\r' line; do
              if (( SECONDS - last >= 10 )); then
                printf '%s\n' "${line%$'\n'}"
                last=$SECONDS
              fi
            done
            printf '%s' "$line"
          }

          # Parallel uploads share one log, so tag every line with its asset.
          prefix() {
            local line
            while IFS= read -r line || [[ -n "$line" ]]; do
              printf '[%s] %s\n' "$1" "$line"
            done
          }

          upload() {
            local file=$1 asset response attempt
            asset=$(basename "$file")
            response="response-$asset.json"
            for attempt in 1 2 3; do
              echo "Uploading ($(du -h "$file" | cut -f1)), attempt $attempt"
              rm -f "$response"
              # Uploads from GitHub runners to Gitee can stall indefinitely; give up below 10 KB/s for a minute.
              if curl -S --fail-with-body -o "$response" \
                --speed-limit 10240 --speed-time 60 \
                --form-string "access_token=$GITEE_TOKEN" \
                -F "file=@$file" \
                "$api/releases/$id/attach_files" 2>&1 | throttle_progress; then
                echo "Attached"
                return 0
              fi
              cat "$response" 2> /dev/null || true
              echo
              # The upload may have completed on Gitee even though curl gave up waiting for the response.
              if grep -qxF "$asset" <<< "$(attached_names)"; then
                echo "Attached"
                return 0
              fi
            done
            return 1
          }

          # Uploads start in this order: Windows, then Linux, then anything else.
          shopt -s nullglob
          files=(dist/*-win-* dist/*-linux-*)
          for file in dist/*; do
            [[ "$file" == *-win-* || "$file" == *-linux-* ]] || files+=("$file")
          done

          attached=$(attached_names)
          pids=()
          assets=()
          for file in "${files[@]}"; do
            asset=$(basename "$file")
            if grep -qxF "$asset" <<< "$attached"; then
              echo "Already attached: $asset"
              continue
            fi
            ( upload "$file" 2>&1 | prefix "$asset" ) &
            pids+=("$!")
            assets+=("$asset")
          done

          failed=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "::error::Could not attach ${assets[$i]} after 3 attempts"
              failed=1
            fi
          done
          exit "$failed"
